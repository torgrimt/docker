services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:v0.27.0
    container_name: homebox
    restart: unless-stopped
    ports:
      - "${HBOX_PORT:-7745}:7745"
    environment:
      - HBOX_MODE=production
      - HBOX_OPTIONS_ALLOW_ANALYTICS=false
      - HBOX_AUTH_API_KEY_PEPPER=${HBOX_AUTH_API_KEY_PEPPER}
    volumes:
      - ./data:/data
