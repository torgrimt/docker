# Alloy shipper: this host's container logs and any syslog it receives -> the
# central Loki. Provide these four in a gitignored .env next to this file
# (one .env per host; nothing secret is tracked here):
#
#   ALLOY_CLUSTER_NAME   label for the site, e.g. the cluster slug
#   ALLOY_LOKI_URL       full push URL, .../loki/api/v1/push
#   ALLOY_LOKI_USER      basic-auth user in front of Loki
#   ALLOY_LOKI_PASS      that user's password

services:
  alloy:
    image: grafana/alloy:v1.21.2
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      # "raw" syslog parsing (KT-NOS headers) is an experimental feature
      - --stability.level=experimental
    ports:
      - "1514:1514/udp"
      - "1514:1514/tcp"
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    environment:
      - CLUSTER_NAME=${ALLOY_CLUSTER_NAME:-nl-home}
      - LOKI_URL=${ALLOY_LOKI_URL}
      - LOKI_USER=${ALLOY_LOKI_USER}
      - LOKI_PASS=${ALLOY_LOKI_PASS}
